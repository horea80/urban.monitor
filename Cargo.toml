[workspace]
resolver = "2"
members = ["crates/shared", "crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# shared (compiles to wasm too)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
unicode-normalization = "0.1"
thiserror = "2"
form_urlencoded = "1"

# server-only
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "compression-gzip", "set-header"] }
tower_governor = { version = "0.8", default-features = false, features = ["axum"] }
utoipa = { version = "5", features = ["axum_extras", "chrono"] }
utoipa-axum = "0.2"
utoipa-scalar = { version = "0.3", features = ["axum"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "json"] }
scraper = "0.27"
pdf-extract = "0.12"
rusqlite = { version = "0.40", features = ["bundled"] }
r2d2 = "0.8"
r2d2_sqlite = "0.35"
rusqlite_migration = "2"
clap = { version = "4", features = ["derive", "env"] }
url = "2"
regex = "1"
tempfile = "3"

# ui
dioxus = "0.7"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

# wasm bundle size matters on mobile. dx construiește clientul sub `wasm-release` și serverul sub
# `server-release` (moștenit din `release`); deploy/build.sh relaxează LTO și codegen-units pentru
# ambele prin `--config`, ca build-ul de producție să dureze secunde (vezi acolo și ADR-0010).
[profile.wasm-release]
inherits = "release"
opt-level = "z"
