services:
  urban:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      URBAN_START_YEAR: "2026"
      URBAN_SYNC_HOURS: "6"
      URBAN_REFRESH_DAYS: "45"
      RUST_LOG: "info,urban_core=debug"
    volumes:
      - urban_data:/data
    expose:
      - "8080"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - urban

volumes:
  urban_data:
  caddy_data:
  caddy_config:
